###
#   Banco de dados em memória (H2)
#
#   Não há nada para instalar nem configurar: o schema é criado no boot e os
#   grafos de exemplo são semeados pelo DataBaseLoader a cada inicialização.
###
spring.datasource.url=jdbc:h2:mem:graphdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

###
#   Console web do H2, em http://localhost:8080/h2-console
#   (use a JDBC URL acima para conectar)
###
spring.h2.console.enabled=true

###
#   Hibernate
###
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
